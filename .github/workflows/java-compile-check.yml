name: Java compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'TMessagesProj/src/main/java/**'
      - 'TMessagesProj/build.gradle'
      - 'TMessagesProj_App/src/main/java/**'
      - 'TMessagesProj_App/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'Tools/maven/**'
      - 'plugins-pysdk/**'
      - 'tools/ci/**'
      - '.github/workflows/java-compile-check.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Python SDK test dependencies
        run: python -m pip install requests PyYAML Pillow packaging

      - name: Test bundled Python SDK
        env:
          PYTHONPATH: plugins-pysdk/src
        run: python -m unittest discover -s plugins-pysdk/tests -v

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;37.0.0 platforms;android-37.0'

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n' >> ~/.gradle/gradle.properties

      - name: Configure API placeholders
        run: |
          printf 'apiId=1\napiHash=0123456789abcdef0123456789abcdef\nmapsApiKey=placeholder\nhelperBotId=1\nhelperBotUsername=placeholder\n' >> local.properties

      - name: Configure Google Services placeholder
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > TMessagesProj_App/google-services.json
          else
            cat > TMessagesProj_App/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789","project_id":"compile-only","storage_bucket":"compile-only.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:0123456789abcdef","android_client_info":{"package_name":"tw.nekomimi.nekogram"}},"api_key":[{"current_key":"compile-only"}],"services":{}}],"configuration_version":"1"}
          JSON
          fi

      - name: Build debug APKs
        run: |
          set +e
          ./gradlew :TMessagesProj:buildPythonSdkRelease :TMessagesProj:compileReleaseJavaWithJavac :TMessagesProj_App:compileReleaseJavaWithJavac :TMessagesProj_App:assembleDebug --console=plain > gradle-compile.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python tools/ci/report_gradle_errors.py gradle-compile.log
            exit "$result"
          fi
          cat gradle-compile.log

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: irongram-debug-apks
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
