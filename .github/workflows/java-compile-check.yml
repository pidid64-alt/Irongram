name: Java compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'TMessagesProj/src/main/java/**'
      - 'TMessagesProj/build.gradle'
      - 'tools/ci/**'
      - '.github/workflows/java-compile-check.yml'

jobs:
  compile:
    environment: GOOGLE_SERVICES_JSON
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 platforms;android-37.0"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Configure local.properties
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            printf 'apiId=%s\n' "$API_ID" >> local.properties
            printf 'apiHash=%s\n' "$API_HASH" >> local.properties
          else
            echo "API_ID/API_HASH are not configured; using placeholders for a compile-only check."
            printf 'apiId=1\n' >> local.properties
            printf 'apiHash=0123456789abcdef0123456789abcdef\n' >> local.properties
          fi

      - name: Compile Java sources
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --console=plain 2>&1 | tee gradle-compile.log

      - name: Report compile errors
        if: failure()
        run: python tools/ci/report_gradle_errors.py gradle-compile.log
