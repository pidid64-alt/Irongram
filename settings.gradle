pluginManagement {
    includeBuild('build-logic')
    includeBuild('TMessagesProj_Modules/media/build-logic-settings')
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'gradlebuild.media3-settings-logic'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Vendored artifacts first: exteraHook's Xposed compatibility layer (hook-core), its LSPlant
        // fork and its shadowhook copy. They are listed before Maven Central so the ARM-only native
        // packages we patch for the other ABIs win over the upstream artifacts. See
        // TMessagesProj/src/main/java/tw/nekomimi/nekogram/plugins/hooks/ and docs/plugins.md.
        maven {
            url = uri("./Tools/maven")
            content {
                includeGroup("com.exteragram.hook")
                includeGroup("com.exteragram.hook.thirdparty")
                includeGroup("com.bytedance.android")
            }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "Irongram"
include ':TMessagesProj'
include ':TMessagesProj_App'
//include ':TMessagesProj_AppHuawei'
//include ':TMessagesProj_AppHockeyApp'
//include ':TMessagesProj_AppStandalone'
//include ':TMessagesProj_AppTests'
include ':jlatexmath'
//project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

includeMedia3.execute(file('TMessagesProj_Modules/media'))
include ':baselineprofile'
